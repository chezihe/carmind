# GPU 서버(RunPod) 본 학습: Qwen3.5-9B + 전체 학습 데이터, closed 형식.
# sft_7b_closed.yaml과 같은 데이터·epoch·실효 배치·lr·LoRA r/alpha로 두고 모델과 LoRA 대상 이름, 생각 모드 설정만 바꿨다.
# 메모리 기준: A100 80GB에서 그대로 돈다 (예상 수치는 docs/runpod.md).
runtime:
  device: cuda
  dtype: bfloat16  # Ampere(A100) 이후 GPU는 bf16 지원. fp16과 달리 지수 범위가 fp32와 같아 grad scaler 없이도 overflow 걱정이 적다
  seed: 42

model:
  name: Qwen/Qwen3.5-9B
  # PyTorch 내장 scaled-dot-product attention. flash-attn은 CUDA·torch 버전에 맞는 빌드가 필요해 의존성에 넣지 않았다
  attn_implementation: sdpa
  # 9B 템플릿은 기본이 생각 모드다. 꺼야 프롬프트에 빈 think 블록이 들어가 label에는 답변만 남는다
  chat_template_kwargs:
    enable_thinking: false

data:
  train: data/processed/sft/closed/train.jsonl
  val: data/processed/sft/closed/val.jsonl
  max_train_samples: null   # 전체 16,176개
  max_val_samples: null     # 전체 850개
  max_seq_len: 512          # 7B와 같게 둔다. Qwen3.5 토크나이저로는 최대 ~320토큰이라 잘리는 샘플이 없다

lora:
  r: 16             # 저랭크 행렬의 차원. 클수록 표현력↑, 학습 파라미터↑
  alpha: 32         # 스케일 = alpha / r. 보통 r의 2배
  dropout: 0.05
  # Qwen3.5 텍스트 층의 모든 선형층 (attention + MLP). 7B와 같은 규칙이지만 층 구성이 달라 이름 목록 대신 정규식을 쓴다.
  # 전체 32층 중 4층마다 하나만 일반 attention(self_attn)이고 나머지 24층은 Gated DeltaNet(linear_attn)이다.
  # q_proj 같은 이름만 나열하면 linear_attn이 통째로 빠지고, 정규식은 visual·lm_head·conv1d에 붙지 않는다.
  target_modules: '.*\.layers\.\d+\.(self_attn\.[qkvo]_proj|linear_attn\.(in_proj_qkv|in_proj_z|in_proj_a|in_proj_b|out_proj)|mlp\.(gate|up|down)_proj)'

train:
  lr: 2.0e-4               # LoRA는 전체 미세조정(1e-5대)보다 큰 lr을 쓴다
  num_epochs: 1            # 16,176 / 16 → 약 1,011 step. max_steps는 데이터 수로 자동 계산
  warmup_steps: 30         # 전체의 ~3%. smoke(90 step 중 10)처럼 11%로 두면 1,000 step 중 110 step이 warmup이라 너무 길다
  batch_size: 4            # 한 번에 GPU에 올리는 샘플 수. 가장 긴 배치(4×352)에서도 checkpointing 없이 ~45GB 이하로 추정
  grad_accum: 4            # 실효 배치 16 = smoke와 같음 (lr 2e-4를 그대로 쓰기 위해)
  max_grad_norm: 1.0
  gradient_checkpointing: false  # 짧은 입력이라 메모리 여유가 있어 끈다 (켜면 ~25% 느려짐)
  log_every: 10
  eval_every: 200          # val 850개 평가 1회 수십 초. 학습 중 5번 + 시작·끝
  save_every_minutes: 15   # 끊겨도 최대 15분어치만 다시 돌면 된다 (체크포인트 1개 ~0.6GB)
  keep_checkpoints: 2

output_dir: outputs/sft_9b_closed
